<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Veg & Heritage Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 12px;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
    }
    h2 { color: #2c3e50; margin-top: 5px; }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 15px;
      font-weight: bold;
    }
    #map {
      height: 250px;
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }
    .place-card {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      border-left: 5px solid #27ae60;
    }
    .heritage-card {
      border-left-color: #e67e22;
    }
    #status {
      font-size: 14px;
      margin-bottom: 10px;
      color: #555;
    }
  </style>
</head>
<body>

  <h2>📍 Veg & Heritage Spotter</h2>
  <p>Find pure vegetarian food, hotels, and historic structures near you.</p>

  <button onclick="getPlaces()">Find Places Near Me</button>

  <div id="status"></div>
  <div id="map"></div>
  <div id="results"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, placesGroup;

    // Verified Local Pure Veg Spots & Hotels near Bongloor / Turkayamjal / Adibatla
    const verifiedVegSpots = [
      { name: "S R Sri Raghavendra Udupi Veg", lat: 17.2510, lon: 78.5830, type: "Pure Veg Restaurant" },
      { name: "Aravali Dhaba & Family Restaurant", lat: 17.2430, lon: 78.5810, type: "Vegetarian / Dhaba" },
      { name: "Sri Raghavendra Udupi Pure Veg Hotel", lat: 17.2480, lon: 78.5820, type: "Veg Hotel & Breakfast" },
      { name: "New Balaji Santosh Dhaba", lat: 17.2600, lon: 78.5750, type: "Pure Veg Dhaba" },
      { name: "Swathi Mess & Dhaba", lat: 17.2450, lon: 78.5800, type: "Veg South Indian" }
    ];

    async function getPlaces() {
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');

      statusDiv.innerText = "Accessing GPS location...";

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        document.getElementById('map').style.display = 'block';
        if (!map) {
          map = L.map('map').setView([lat, lon], 12);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          placesGroup = L.layerGroup().addTo(map);
        } else {
          map.setView([lat, lon], 12);
          placesGroup.clearLayers();
        }

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lon]).addTo(map).bindPopup('You are here').openPopup();

        statusDiv.innerText = "Searching nearby eateries & landmarks...";

        // Add verified local pure veg spots to the map
        resultsDiv.innerHTML = "";
        let totalFound = 0;

        verifiedVegSpots.forEach(item => {
          L.marker([item.lat, item.lon])
           .addTo(placesGroup)
           .bindPopup(`<b>${item.name}</b><br>${item.type}`);

          const card = document.createElement('div');
          card.className = 'place-card';
          card.innerHTML = `
            <strong>🥗 ${item.name}</strong>
            <p style="margin:5px 0 0 0; font-size:13px; color:#27ae60; font-weight:bold;">
              Type: ${item.type} (Verified Pure Veg)
            </p>
          `;
          resultsDiv.appendChild(card);
          totalFound++;
        });

        // Query OpenStreetMap for named historic landmarks
        const rawQuery = `[out:json][timeout:15];(node["historic"](around:8000,${lat},${lon}););out center 15;`;
        const overpassUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(rawQuery)}`;

        try {
          const response = await fetch(overpassUrl);
          if (response.ok) {
            const data = await response.json();
            if (data.elements) {
              data.elements.forEach(item => {
                // Only show entries that have a real name tag
                if (item.tags && item.tags.name) {
                  const name = item.tags.name;
                  const itemLat = item.lat || item.center?.lat;
                  const itemLon = item.lon || item.center?.lon;

                  if (itemLat && itemLon) {
                    L.marker([itemLat, itemLon])
                     .addTo(placesGroup)
                     .bindPopup(`<b>${name}</b><br>Heritage Site`);
                  }

                  const card = document.createElement('div');
                  card.className = 'place-card heritage-card';
                  card.innerHTML = `
                    <strong>🏛️ ${name}</strong>
                    <p style="margin:5px 0 0 0; font-size:13px; color:#e67e22; font-weight:bold;">
                      Type: ${item.tags.historic || 'Heritage / Landmark'}
                    </p>
                  `;
                  resultsDiv.appendChild(card);
                  totalFound++;
                }
              });
            }
          }
        } catch (e) {
          console.log("Heritage fetch deferred");
        }

        statusDiv.innerText = `Found ${totalFound} named spots near you:`;

      }, (err) => {
        statusDiv.innerText = "Location Error: Please ensure GPS is enabled on your device.";
      });
    }
  </script>
</body>
</html>
