<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Veg & Heritage Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      background-color: #f4f6f8;
      color: #333;
    }
    h2 { color: #2c3e50; }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>📍 Veg & Heritage Spotter</h2>
  <p>Find pure vegetarian food and historic structures near you.</p>

  <input type="password" id="apiKey" placeholder="Paste OpenRouter API Key Here" />
  <button onclick="getPlaces()">Find Places Near Me</button>

  <div id="status"></div>
  <div id="output" class="card" style="display:none;"></div>

  <script>
    async function getPlaces() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const statusDiv = document.getElementById('status');
      const outputDiv = document.getElementById('output');

      if (!apiKey) {
        alert('Please enter your OpenRouter API Key!');
        return;
      }

      statusDiv.innerText = "Getting your location...";

      if (!navigator.geolocation) {
        statusDiv.innerText = "Geolocation is not supported by your browser.";
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        statusDiv.innerText = "Searching nearby spots via AI...";

        const prompt = `Given the coordinates Latitude: ${lat}, Longitude: ${lon}, list:
1. 3 Pure Vegetarian Restaurants nearby.
2. 3 Historical or Heritage sites/structures nearby.
Provide brief descriptions and approximate distances for each place.`;

        try {
          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'openrouter/auto',
              messages: [{ role: 'user', content: prompt }]
            })
          });

          const data = await response.json();
          if (data.choices && data.choices[0]) {
            statusDiv.innerText = "";
            outputDiv.style.display = "block";
            outputDiv.innerText = data.choices[0].message.content;
          } else {
            statusDiv.innerText = "Failed to fetch data. Check your API key.";
          }
        } catch (err) {
          statusDiv.innerText = "Error fetching results: " + err.message;
        }
      }, () => {
        statusDiv.innerText = "Unable to retrieve your location. Make sure location services are turned on.";
      });
    }
  </script>
</body>
</html>
