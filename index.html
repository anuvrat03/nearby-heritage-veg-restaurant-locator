<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Veg & Heritage Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 12px;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
    }
    h2 { color: #2c3e50; margin-top: 5px; }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 10px;
      font-weight: bold;
    }
    input {
      width: 95%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    #map {
      height: 250px;
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }
    .place-card {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      border-left: 5px solid #27ae60;
    }
    .heritage-card {
      border-left-color: #e67e22;
    }
    .key-status {
      font-size: 13px;
      color: #27ae60;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .change-key-link {
      font-size: 12px;
      color: #888;
      text-decoration: underline;
      cursor: pointer;
      display: block;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>📍 Veg & Heritage Spotter</h2>
  <p>Find pure vegetarian food and historic structures near you.</p>

  <!-- Key Entry Section (Hidden when key exists) -->
  <div id="keySection">
    <input type="password" id="apiKey" placeholder="Paste Google AI Studio Key Here" />
    <button onclick="saveKey()">Save Key on Device</button>
  </div>

  <!-- Main App Section -->
  <div id="appSection" style="display:none;">
    <div class="key-status">✓ API Key Active</div>
    <button onclick="getPlaces()">Find Places Near Me</button>
  </div>

  <div id="status"></div>
  <div id="map"></div>
  <div id="results"></div>

  <span id="resetLink" class="change-key-link" style="display:none;" onclick="resetKey()">Change Saved Key</span>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker;

    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_key');
      if (savedKey) {
        document.getElementById('keySection').style.display = 'none';
        document.getElementById('appSection').style.display = 'block';
        document.getElementById('resetLink').style.display = 'block';
      }
    };

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) {
        alert('Please paste a valid Google AI Studio key!');
        return;
      }
      localStorage.setItem('gemini_key', key);
      document.getElementById('keySection').style.display = 'none';
      document.getElementById('appSection').style.display = 'block';
      document.getElementById('resetLink').style.display = 'block';
    }

    function resetKey() {
      localStorage.removeItem('gemini_key');
      document.getElementById('keySection').style.display = 'block';
      document.getElementById('appSection').style.display = 'none';
      document.getElementById('resetLink').style.display = 'none';
      document.getElementById('apiKey').value = '';
    }

    async function getPlaces() {
      const apiKey = localStorage.getItem('gemini_key');
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');

      if (!apiKey) {
        alert('API Key missing. Please click Change Saved Key.');
        return;
      }

      statusDiv.innerText = "Accessing GPS location...";

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        document.getElementById('map').style.display = 'block';
        if (!map) {
          map = L.map('map').setView([lat, lon], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        } else {
          map.setView([lat, lon], 14);
        }

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lon]).addTo(map).bindPopup('You are here').openPopup();

        statusDiv.innerText = "Searching nearby spots via Google AI...";

        const prompt = `Given latitude ${lat} and longitude ${lon}, list 3 pure vegetarian restaurants and 3 historical/heritage sites nearby.
Return ONLY a raw JSON array with no markdown backticks, matching this exact format:
[
  {"type": "veg", "name": "Place Name", "desc": "Brief description", "dist": "Distance in km"},
  {"type": "heritage", "name": "Site Name", "desc": "Brief description", "dist": "Distance in km"}
]`;

        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
          
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            statusDiv.innerText = "";
            resultsDiv.innerHTML = "";

            let rawText = data.candidates[0].content.parts[0].text;
            let cleanJson = rawText.replace(/```json|```/g, '').trim();
            const places = JSON.parse(cleanJson);

            places.forEach(item => {
              const card = document.createElement('div');
              card.className = `place-card ${item.type === 'heritage' ? 'heritage-card' : ''}`;
              card.innerHTML = `
                <strong>${item.type === 'veg' ? '🥗' : '🏛️'} ${item.name}</strong> (${item.dist})
                <p style="margin:5px 0 0 0; font-size:14px; color:#555;">${item.desc}</p>
              `;
              resultsDiv.appendChild(card);
            });
          } else {
            statusDiv.innerText = "Error: " + (data.error?.message || "Invalid Google AI Studio Key.");
          }
        } catch (err) {
          statusDiv.innerText = "Error processing places: " + err.message;
        }
      }, (err) => {
        statusDiv.innerText = "Location Error: Please ensure Location (GPS) is turned on.";
      });
    }
  </script>
</body>
</html>
