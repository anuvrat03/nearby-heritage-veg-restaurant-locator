<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Veg & Heritage Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 12px;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
    }
    h2 { color: #2c3e50; margin-top: 5px; }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 15px;
      font-weight: bold;
    }
    #map {
      height: 250px;
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }
    .place-card {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      border-left: 5px solid #27ae60;
    }
    .heritage-card {
      border-left-color: #e67e22;
    }
    #status {
      font-size: 14px;
      margin-bottom: 10px;
      color: #555;
    }
  </style>
</head>
<body>

  <h2>📍 Veg & Heritage Spotter</h2>
  <p>Find pure vegetarian food and historic structures near you.</p>

  <button onclick="getPlaces()">Find Places Near Me</button>

  <div id="status"></div>
  <div id="map"></div>
  <div id="results"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, placesGroup;

    async function getPlaces() {
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');

      statusDiv.innerText = "Accessing GPS location...";

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        document.getElementById('map').style.display = 'block';
        if (!map) {
          map = L.map('map').setView([lat, lon], 12);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          placesGroup = L.layerGroup().addTo(map);
        } else {
          map.setView([lat, lon], 12);
          placesGroup.clearLayers();
        }

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lon]).addTo(map).bindPopup('You are here').openPopup();

        statusDiv.innerText = "Searching wider area (10km) for eateries & landmarks...";

        // Broadened search query (10000m / 10km radius for food, cafes, temples, historic sites)
        const rawQuery = `[out:json][timeout:25];(node["amenity"~"restaurant|food_court|fast_food|cafe"](around:10000,${lat},${lon});node["historic"](around:10000,${lat},${lon});node["amenity"="place_of_worship"](around:10000,${lat},${lon}););out center 20;`;
        
        const overpassUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(rawQuery)}`;

        try {
          const response = await fetch(overpassUrl);
          if (!response.ok) throw new Error(`Status ${response.status}`);

          const data = await response.json();
          resultsDiv.innerHTML = "";

          if (!data.elements || data.elements.length === 0) {
            statusDiv.innerText = "No results found within 10km radius.";
            return;
          }

          statusDiv.innerText = `Found ${data.elements.length} spots near you:`;

          data.elements.forEach(item => {
            const name = item.tags?.name || "Local Eatery / Spot";
            const isHeritage = item.tags?.historic !== undefined || item.tags?.amenity === 'place_of_worship';
            const itemLat = item.lat || item.center?.lat;
            const itemLon = item.lon || item.center?.lon;

            if (itemLat && itemLon) {
              L.marker([itemLat, itemLon])
               .addTo(placesGroup)
               .bindPopup(`<b>${name}</b><br>${isHeritage ? 'Heritage / Culture' : 'Food Spot'}`);
            }

            const card = document.createElement('div');
            card.className = `place-card ${isHeritage ? 'heritage-card' : ''}`;
            card.innerHTML = `
              <strong>${isHeritage ? '🏛️' : '🥗'} ${name}</strong>
              <p style="margin:5px 0 0 0; font-size:13px; color:#666;">
                Type: ${isHeritage ? (item.tags.historic || 'Heritage / Landmark') : (item.tags.amenity || 'Eatery')}
              </p>
            `;
            resultsDiv.appendChild(card);
          });

        } catch (err) {
          statusDiv.innerText = "Error fetching map data: " + err.message;
        }
      }, (err) => {
        statusDiv.innerText = "Location Error: Please ensure GPS is enabled on your S20 FE.";
      });
    }
  </script>
</body>
</html>
